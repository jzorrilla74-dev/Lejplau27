<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>LeJplauu — UI redesign explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#f4f3ee; font-family: Inter, system-ui, sans-serif; }
  /* shared mock-app reset */
  .app { font-family: inherit; -webkit-font-smoothing: antialiased; }
  .app * { box-sizing: border-box; }
  /* SVG icon sizing */
  .ico { width:14px; height:14px; stroke-width:1.6; flex-shrink:0; }
  .ico-sm { width:12px; height:12px; stroke-width:1.6; flex-shrink:0; }
  .ico-lg { width:16px; height:16px; stroke-width:1.6; flex-shrink:0; }

  /* ====================================================================
     A — REFINED CAD
     Hairline borders, mono numerics, near-monochrome, indigo dot only as
     status. Drafting/engineering feel.
  ==================================================================== */
  .a {
    --bg:#ffffff;
    --bg-1:#f7f6f3;
    --bg-2:#efede8;
    --tx:#1a1a18;
    --tx-2:#5d5b54;
    --tx-3:#9c9991;
    --bd:#e0ddd5;
    --bd-2:#c8c4b9;
    --accent:#2f2a73;   /* deep indigo */
    --green:#1d7a55;
    --red:#b83a39;
    --amber:#a06318;
    color:var(--tx);
    background:var(--bg);
    font-size:13px;
    line-height:1.45;
    font-family: Inter, system-ui, sans-serif;
    font-feature-settings: "ss01","cv11";
  }
  .a .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-feature-settings:"tnum","zero"; }
  .a .num { font-variant-numeric: tabular-nums; }

  .a .shell { display:grid; grid-template-columns: 300px 1fr 360px; height:880px; }
  .a .panel { background:var(--bg); border-right:1px solid var(--bd); display:flex; flex-direction:column; min-height:0; }
  .a .panel.right { border-right:none; border-left:1px solid var(--bd); }
  .a .panel-header {
    padding:14px 16px 12px; border-bottom:1px solid var(--bd);
    display:flex; align-items:center; gap:10px;
  }
  .a .crumb { font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--tx-3); }
  .a .title { font-size:16px; font-weight:600; letter-spacing:-.01em; }
  .a .title-row { display:flex; align-items:center; justify-content:space-between; width:100%; }
  .a .pill {
    display:inline-flex; align-items:center; gap:5px;
    height:20px; padding:0 7px; border-radius:3px;
    font-size:10px; font-weight:500; letter-spacing:.04em;
    background:var(--bg-1); color:var(--tx-2); border:1px solid var(--bd);
  }
  .a .pill .dot { width:5px; height:5px; border-radius:50%; background:var(--accent); }

  /* Brief sections */
  .a .sec { border-bottom:1px solid var(--bd); }
  .a .sec-head {
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:11px 16px; background:transparent; border:none; cursor:pointer;
    color:var(--tx); font:inherit; font-weight:600; font-size:12px;
    letter-spacing:-.005em;
  }
  .a .sec-head .meta { color:var(--tx-3); font-size:10px; font-weight:500; letter-spacing:.05em; text-transform:uppercase; }
  .a .sec-body { padding:4px 16px 14px; }
  .a label.lbl { display:block; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--tx-3); margin:10px 0 5px; font-weight:500; }
  .a label.lbl:first-child { margin-top:2px; }
  .a .field {
    width:100%; height:30px; padding:0 9px;
    background:var(--bg); border:1px solid var(--bd); border-radius:4px;
    font:inherit; font-size:12px; color:var(--tx);
  }
  .a .field:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(47,42,115,.08); }
  .a textarea.field { height:auto; padding:7px 9px; resize:vertical; min-height:54px; line-height:1.45; }
  .a .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  .a .stepper { display:flex; align-items:stretch; height:30px; border:1px solid var(--bd); border-radius:4px; overflow:hidden; }
  .a .stepper button { width:32px; background:var(--bg-1); border:none; color:var(--tx); cursor:pointer; font-size:14px; }
  .a .stepper button:hover { background:var(--bg-2); }
  .a .stepper .v { flex:1; display:grid; place-items:center; font-weight:500; font-variant-numeric:tabular-nums; border-left:1px solid var(--bd); border-right:1px solid var(--bd); }

  .a .seg { display:flex; border:1px solid var(--bd); border-radius:4px; overflow:hidden; height:28px; }
  .a .seg button { flex:1; background:var(--bg); border:none; color:var(--tx-2); font:inherit; font-size:11px; cursor:pointer; }
  .a .seg button + button { border-left:1px solid var(--bd); }
  .a .seg button[aria-pressed="true"] { background:var(--tx); color:var(--bg); font-weight:500; }

  /* Programme table */
  .a table.prog { width:100%; border-collapse:collapse; font-size:11px; margin-top:4px; }
  .a table.prog th { text-align:left; font-weight:500; color:var(--tx-3); font-size:10px; letter-spacing:.05em; text-transform:uppercase; padding:6px 4px; border-bottom:1px solid var(--bd); }
  .a table.prog td { padding:7px 4px; border-bottom:1px solid var(--bd); vertical-align:middle; }
  .a table.prog td:first-child, .a table.prog th:first-child { padding-left:0; }
  .a table.prog td:last-child, .a table.prog th:last-child { padding-right:0; text-align:right; }
  .a .prio { display:inline-flex; align-items:center; height:18px; padding:0 7px; border-radius:9px; font-size:10px; letter-spacing:.02em; font-weight:500; }
  .a .prio.ess { background:#efeefa; color:var(--accent); }
  .a .prio.des { background:#f3f1ec; color:var(--tx-2); }
  .a .prio.opt { background:transparent; color:var(--tx-3); border:1px solid var(--bd); }
  .a .prog input[type=number] { width:42px; height:22px; border:1px solid var(--bd); border-radius:3px; padding:0 4px; font:inherit; font-size:11px; font-variant-numeric:tabular-nums; background:var(--bg); }
  .a .prog input[type=text]   { width:100%; border:1px solid transparent; background:transparent; font:inherit; font-size:11px; padding:2px 0; color:var(--tx); }

  /* Toolbar */
  .a .toolbar {
    height:42px; display:flex; align-items:center; gap:4px; padding:0 12px;
    border-bottom:1px solid var(--bd); background:var(--bg);
  }
  .a .tb-group { display:flex; align-items:center; gap:2px; }
  .a .tb-sep { width:1px; height:18px; background:var(--bd); margin:0 6px; }
  .a .iconbtn {
    height:28px; min-width:28px; padding:0 6px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:transparent; border:1px solid transparent; border-radius:4px; color:var(--tx-2); cursor:pointer;
    font:inherit; font-size:11px;
  }
  .a .iconbtn:hover { background:var(--bg-1); color:var(--tx); }
  .a .iconbtn[aria-pressed="true"] { background:var(--bg-2); color:var(--tx); border-color:var(--bd); }
  .a .iconbtn.primary { color:#fff; background:var(--accent); border-color:var(--accent); padding:0 11px; font-weight:500; }
  .a .iconbtn.primary:hover { background:#221d5e; }
  .a .zoom { display:flex; align-items:center; height:28px; border:1px solid var(--bd); border-radius:4px; overflow:hidden; }
  .a .zoom button { width:28px; height:28px; background:transparent; border:none; color:var(--tx-2); cursor:pointer; }
  .a .zoom .v { padding:0 8px; font-size:11px; color:var(--tx-2); border-left:1px solid var(--bd); border-right:1px solid var(--bd); height:28px; display:grid; place-items:center; min-width:64px; font-variant-numeric:tabular-nums; }
  .a .progress { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:11px; color:var(--tx-2); }
  .a .progress .bar { width:80px; height:4px; background:var(--bg-2); border-radius:2px; overflow:hidden; }
  .a .progress .bar > i { display:block; height:100%; background:var(--accent); width:60%; }

  /* Canvas */
  .a .canvas-wrap { flex:1; min-height:0; position:relative; background:
    linear-gradient(var(--bg-1) 1px, transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg, var(--bg-1) 1px, transparent 1px) 0 0/24px 24px,
    var(--bg);
    overflow:hidden;
  }
  .a .ruler-x, .a .ruler-y { position:absolute; background:var(--bg); color:var(--tx-3); font-family:"JetBrains Mono",monospace; font-size:9px; font-variant-numeric:tabular-nums; }
  .a .ruler-x { top:0; left:0; right:0; height:18px; border-bottom:1px solid var(--bd); display:flex; align-items:center; }
  .a .ruler-y { top:0; bottom:0; left:0; width:24px; border-right:1px solid var(--bd); display:flex; flex-direction:column; padding-top:18px; }
  .a .ruler-x span, .a .ruler-y span { padding:0 6px; }
  .a .ruler-y span { padding:6px 4px; text-align:right; }

  .a .lot {
    position:absolute; left:80px; top:60px; width:330px; height:760px;
    background:#fff;
    border:1px solid var(--tx);
    box-shadow: 0 1px 0 rgba(0,0,0,.04);
  }
  .a .lot::before {
    content:""; position:absolute; inset:38px 12px 56px 12px;
    border:1px dashed var(--bd-2);
  }
  .a .lot .lot-tag { position:absolute; top:8px; left:10px; font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--tx-3); letter-spacing:.04em; }
  .a .lot .lot-dim-w { position:absolute; top:-22px; left:0; right:0; text-align:center; font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--tx-3); }
  .a .lot .lot-dim-h { position:absolute; left:-50px; top:50%; transform:translateY(-50%) rotate(-90deg); transform-origin:center; font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--tx-3); white-space:nowrap; }

  .a .room {
    position:absolute; border:1px solid var(--tx); background:#fff;
    display:flex; flex-direction:column; padding:8px 9px; gap:2px;
  }
  .a .room .lab { font-size:11px; font-weight:500; }
  .a .room .a2 { font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--tx-3); }
  .a .room.living { background:#fbf6e8; }
  .a .room.kitchen { background:#f3eed7; }
  .a .room.bed { background:#eef0e3; }
  .a .room.wet { background:#e6ecef; }
  .a .room.outdoor { background:#eaeee0; border-style:dashed; }
  .a .room.selected { box-shadow: 0 0 0 2px var(--accent), 0 0 0 4px rgba(47,42,115,.15); }
  .a .handle { position:absolute; width:6px; height:6px; background:#fff; border:1px solid var(--accent); }
  .a .handle.tl { top:-3px; left:-3px; } .a .handle.tr { top:-3px; right:-3px; }
  .a .handle.bl { bottom:-3px; left:-3px; } .a .handle.br { bottom:-3px; right:-3px; }
  .a .handle.t { top:-3px; left:50%; margin-left:-3px; } .a .handle.b { bottom:-3px; left:50%; margin-left:-3px; }
  .a .handle.l { top:50%; left:-3px; margin-top:-3px; } .a .handle.r { top:50%; right:-3px; margin-top:-3px; }

  /* Right panel: metrics + tabs */
  .a .metrics { padding:16px; border-bottom:1px solid var(--bd); }
  .a .kpi { display:flex; align-items:baseline; gap:8px; margin-bottom:6px; }
  .a .kpi .num { font-family:"JetBrains Mono",monospace; font-size:24px; font-weight:500; letter-spacing:-.01em; }
  .a .kpi .unit { color:var(--tx-3); font-size:11px; font-family:"JetBrains Mono",monospace; }
  .a .kpi .delta { margin-left:auto; font-size:10px; color:var(--tx-3); letter-spacing:.06em; text-transform:uppercase; }
  .a .gauge { height:6px; background:var(--bg-2); border-radius:3px; overflow:hidden; margin:6px 0 12px; position:relative; }
  .a .gauge > i { display:block; height:100%; background:var(--accent); }
  .a .gauge .lim { position:absolute; right:0; top:-3px; bottom:-3px; width:1px; background:var(--tx); }

  .a .breakdown { display:grid; grid-template-columns: 1fr auto; row-gap:5px; column-gap:14px; font-size:11px; }
  .a .breakdown .k { color:var(--tx-2); display:flex; align-items:center; gap:6px; }
  .a .breakdown .k::before { content:""; width:8px; height:8px; border-radius:1px; background:var(--swatch,var(--tx-3)); }
  .a .breakdown .v { font-family:"JetBrains Mono",monospace; color:var(--tx); font-variant-numeric:tabular-nums; }

  .a .alerts { padding:10px 16px; border-bottom:1px solid var(--bd); display:flex; flex-direction:column; gap:6px; background:var(--bg-1); }
  .a .alert { display:flex; align-items:flex-start; gap:8px; font-size:11px; color:var(--tx-2); }
  .a .alert.warn { color:var(--amber); }
  .a .alert.err { color:var(--red); }
  .a .alert .ic { margin-top:1px; }

  .a .tabs { display:flex; border-bottom:1px solid var(--bd); padding:0 12px; }
  .a .tab { padding:11px 12px; font-size:12px; color:var(--tx-3); background:none; border:none; cursor:pointer; position:relative; font:inherit; font-weight:500; }
  .a .tab[aria-selected="true"] { color:var(--tx); }
  .a .tab[aria-selected="true"]::after { content:""; position:absolute; left:8px; right:8px; bottom:-1px; height:2px; background:var(--tx); }

  .a .inspector-card { padding:14px 16px; }
  .a .insp-row { display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-top:1px solid var(--bd); font-size:11px; color:var(--tx-2); }
  .a .insp-row:first-child { border-top:none; }
  .a .insp-row .v { color:var(--tx); font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; }
  .a .ghost-btn { width:100%; height:30px; background:var(--bg); border:1px solid var(--bd); border-radius:4px; color:var(--tx-2); font:inherit; font-size:11px; cursor:pointer; margin-top:10px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .a .ghost-btn:hover { color:var(--red); border-color:var(--red); background:#fff7f6; }

  /* ====================================================================
     B — WARM STUDIO
     Editorial. Warm whites, generous whitespace, serif accent for
     numerals, calmer hierarchy.
  ==================================================================== */
  .b {
    --bg:#faf7f0;
    --bg-1:#f3eee2;
    --bg-2:#ebe5d4;
    --tx:#1f1d18;
    --tx-2:#6b6557;
    --tx-3:#a09a89;
    --bd:#e7e0cf;
    --bd-2:#d6cdb6;
    --accent:#9b4a2a;     /* terracotta */
    --accent-2:#3a4d3a;   /* moss */
    --green:#3a5a3a;
    --red:#a23a3a;
    --amber:#a36a18;
    color:var(--tx);
    background:var(--bg);
    font-size:13px;
    line-height:1.5;
    font-family: Inter, system-ui, sans-serif;
  }
  /* dark warm variant of B */
  .b.dark {
    --bg:#1a1612;
    --bg-1:#221d18;
    --bg-2:#2c2620;
    --tx:#f1ead9;
    --tx-2:#b6ab93;
    --tx-3:#7c7160;
    --bd:#332c24;
    --bd-2:#46392e;
    --accent:#e0825a;     /* warm terracotta */
    --accent-2:#9bbf8a;   /* sage */
    --green:#9bbf8a;
    --red:#e58a7a;
    --amber:#e0a85a;
  }
  .b.dark .brand .mark::after { border-color:var(--bg); }
  .b.dark .room.living  { background:#3a2f1a; border-color:#5a4a28; }
  .b.dark .room.kitchen { background:#3f2c18; border-color:#6a4a26; }
  .b.dark .room.bed     { background:#243121; border-color:#3e5236; }
  .b.dark .room.wet     { background:#1f2a30; border-color:#34464f; }
  .b.dark .room.outdoor { background:#27321f; border-color:#3e4f30; border-style:dashed; }
  .b.dark .room { color:var(--tx); border-width:1px; }
  .b.dark .room .a2 { color:rgba(241,234,217,.65); }
  .b.dark .lot { background:var(--bg-1); border-color:#5a4d3a; box-shadow:0 12px 32px rgba(0,0,0,.4); }
  .b.dark .canvas-wrap { background:var(--bg); }
  .b.dark .canvas-wrap::before { background-image:radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px); }
  .b.dark .toolrail { background:var(--bg-1); border-color:var(--bd-2); box-shadow:0 4px 16px rgba(0,0,0,.3); }
  .b.dark .iconbtn.primary { background:var(--accent); color:#1a1612; border-color:var(--accent); }
  .b.dark .iconbtn.primary:hover { background:#ec9572; }
  .b.dark .seg { background:var(--bg-2); }
  .b.dark .seg button[aria-pressed="true"] { background:var(--bg-1); color:var(--tx); box-shadow:0 1px 2px rgba(0,0,0,.3); }
  .b.dark .stepper button { background:var(--bg-2); border-color:var(--bd-2); color:var(--tx); }
  .b.dark table.prog .check.on { background:var(--accent); border-color:var(--accent); color:var(--bg); }
  .b.dark .chip.ess { background:rgba(224,130,90,.16); color:var(--accent); }
  .b.dark .chip.des { background:var(--bg-2); color:var(--tx-2); }
  .b.dark .chip.opt { color:var(--tx-3); border-color:var(--bd-2); }
  .b.dark .field { background:var(--bg-1); border-color:var(--bd-2); color:var(--tx); }
  .b.dark .field:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(224,130,90,.18); }
  .b.dark .alert.err .ic { background:rgba(229,138,122,.18); color:var(--red); }
  .b.dark .alert.warn .ic { background:rgba(224,168,90,.18); color:var(--amber); }
  .b.dark .crit .ask { background:var(--bg-1); border-color:var(--bd-2); }
  .b.dark .crit .ask .hd .av { background:var(--accent-2); color:#1a1612; }
  .b.dark .crit .input { background:var(--bg-2); border-color:var(--bd-2); }
  .b.dark .crit .input button { background:var(--accent); color:#1a1612; }
  .b.dark .msg.user .av { background:var(--bg-2); color:var(--tx-2); }
  .b.dark .msg.crit .av { background:var(--accent-2); color:#1a1612; }
  .b.dark .metrics .gauge > i { background:linear-gradient(90deg, var(--accent-2), var(--accent)); }
  .b.dark .metrics .big .pct { color:var(--accent-2); }
  .b.dark .brand .name em { color:var(--accent); }
  .b.dark .project .name, .b.dark .canvas-head .h-title, .b.dark .metrics .big .v, .b.dark table.prog .area, .b.dark .msg.crit .av { color: var(--tx); }
  .b.dark .msg.crit .av { color:#1a1612; }

  /* collapsible / draggable panel chrome (used in B) */
  .b .pn { border-bottom:1px solid var(--bd); }
  .b .pn-head { display:flex; align-items:center; gap:8px; padding:10px 14px 10px 8px; cursor:grab; user-select:none; background:transparent; border:none; width:100%; font:inherit; color:var(--tx); }
  .b .pn-head:hover { background:var(--bg-1); }
  .b .pn-head:active { cursor:grabbing; }
  .b .pn-head .grip { width:14px; display:grid; grid-template-columns:repeat(2, 3px); grid-template-rows:repeat(3, 3px); gap:2px; opacity:.45; flex-shrink:0; }
  .b .pn-head .grip i { background:var(--tx-3); border-radius:50%; }
  .b .pn-head .lab { flex:1; text-align:left; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--tx-2); font-weight:600; }
  .b .pn-head .meta { font-size:11px; color:var(--tx-3); margin-right:4px; }
  .b .pn-head .chev { width:18px; height:18px; display:grid; place-items:center; color:var(--tx-3); transition:transform .2s; }
  .b .pn[data-collapsed="true"] .chev { transform:rotate(-90deg); }
  .b .pn[data-collapsed="true"] .pn-body { display:none; }
  .b .pn[data-dragging="true"] { background:var(--bg-1); box-shadow:0 6px 18px rgba(0,0,0,.18); position:relative; z-index:2; }
  .b.dark .pn-head:hover { background:var(--bg-1); }
  .b.dark .pn[data-dragging="true"] { background:var(--bg-2); box-shadow:0 8px 24px rgba(0,0,0,.5); }

  .b .serif { font-family: "Instrument Serif", Georgia, serif; font-style:italic; font-weight:400; }
  .b .mono { font-family: "JetBrains Mono", monospace; }
  .b .shell { display:grid; grid-template-columns: 320px 1fr 360px; height:880px; }
  .b .panel { background:var(--bg); border-right:1px solid var(--bd); display:flex; flex-direction:column; min-height:0; }
  .b .panel.right { border-right:none; border-left:1px solid var(--bd); }

  .b .brand {
    padding:18px 20px 14px; border-bottom:1px solid var(--bd);
    display:flex; align-items:center; gap:10px;
  }
  .b .brand .mark { width:24px; height:24px; border-radius:50%; background:var(--accent); position:relative; }
  .b .brand .mark::after { content:""; position:absolute; inset:6px; border:1px solid var(--bg); border-radius:50%; }
  .b .brand .name { font-size:14px; font-weight:600; letter-spacing:-.01em; }
  .b .brand .name em { font-family:"Instrument Serif",serif; font-style:italic; font-weight:400; color:var(--accent); }

  .b .project {
    padding:14px 20px 16px; border-bottom:1px solid var(--bd);
  }
  .b .project .label { font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--tx-3); margin-bottom:4px; }

  .b .alerts { padding:12px 22px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--bd); }

  .b .alert .body strong { display:block; color:var(--tx); font-weight:500; margin-bottom:2px; }

  .b .tabs { display:flex; padding:14px 22px 0; gap:18px; border-bottom:1px solid var(--bd); }
  .b .tab { padding:0 0 12px; font-size:12px; color:var(--tx-3); background:none; border:none; cursor:pointer; position:relative; font:inherit; letter-spacing:.04em; }

  .b .crit { padding:18px 22px; flex:1; display:flex; flex-direction:column; gap:14px; min-height:0; overflow:auto; }

  }

  .b .crit .ask .hd .nm { font-size:12px; font-weight:500; }

  .b .crit .ask .actions .iconbtn { font-size:11px; height:30px; }
  .b .crit .input { display:flex; gap:6px; align-items:center; padding:6px; background:var(--bg); border:1px solid var(--bd); border-radius:10px; }
  .b .crit .input input { flex:1; height:30px; border:none; background:transparent; font:inherit; font-size:13px; padding:0 8px; }
  .b .crit .input input:focus { outline:none; }

  .b .msg { display:flex; gap:10px; }

  .b .msg.user .av { background:var(--bg-1); color:var(--tx-2); }
  .b .msg.crit .av { background:var(--accent-2); color:#fff; font-family:"Instrument Serif",serif; font-style:italic; }
  .b .msg .body { flex:1; }
  .b .msg .name { font-size:11px; color:var(--tx-2); font-weight:500; margin-bottom:3px; }
  .b .msg .text { font-size:12.5px; color:var(--tx); line-height:1.55; }

  /* ====================================================================
     C — MODERN DASHBOARD (Linear-ish dark)
     Crisp dark, refined indigo accent, clear hierarchy, dashboard chips.
  ==================================================================== */
  .c {
    --bg:#0f0f10;
    --bg-1:#161618;
    --bg-2:#1d1d20;
    --bg-3:#26262a;
    --tx:#ececef;
    --tx-2:#a1a1aa;
    --tx-3:#65656e;
    --bd:#26262a;
    --bd-2:#34343a;
    --accent:#7c70ff;
    --accent-2:#5b50e6;
    --green:#3ad07a;
    --red:#ff6b6b;
    --amber:#ffb547;
    --blue:#5eaaff;
    color:var(--tx);
    background:var(--bg);
    font-size:13px;

  .c .mono { font-family: "Geist Mono","JetBrains Mono",monospace; }

  .c .brand .name { font-weight:600; font-size:13px; letter-spacing:-.005em; }
  .c .brand .ws { color:var(--tx-3); font-size:12px; }

  .c .project { padding:14px 16px; border-bottom:1px solid var(--bd); }
  .c .project .name {
    width:100%; background:transparent; border:none; padding:0;
    font-family:inherit; font-size:15px; font-weight:600; color:var(--tx); letter-spacing:-.01em;
  }
  .c .project .meta { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .c .tag {
    display:inline-flex; align-items:center; gap:5px;

  }

  .c .tag .dot.a { background:var(--amber); }

  .c .tag .dot.b { background:var(--blue); }

  .c .scroll { overflow:auto; flex:1; min-height:0; }
  .c .nav { padding:8px; }
  .c .nav .item {

    color:var(--tx-2); font-size:13px; cursor:pointer; user-select:none;
  }
  .c .nav .item:hover { background:var(--bg-1); color:var(--tx); }

  .c .nav .group-h {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 8px 6px; font-size:11px; font-weight:500;
    color:var(--tx-3); letter-spacing:.04em; text-transform:uppercase;

  .c .nav .group-h .add { width:18px; height:18px; border-radius:4px; display:grid; place-items:center; cursor:pointer; }
  .c .nav .group-h .add:hover { background:var(--bg-2); color:var(--tx); }

  /* compact brief inside left nav */
  .c .nav .field {
    width:100%; height:30px; padding:0 9px;
    background:var(--bg-1); border:1px solid var(--bd); border-radius:6px;
    color:var(--tx); font:inherit; font-size:12px;
  }
  .c .nav .field:focus { outline:none; border-color:var(--accent); }
  .c .nav .stack { padding:6px 8px 4px; display:flex; flex-direction:column; gap:8px; }
  .c .nav .lbl { font-size:11px; color:var(--tx-3); margin-bottom:3px; }

  .c .nav .progrow .nm { flex:1; }
  .c .nav .progrow .a2 { font-family:"Geist Mono",monospace; color:var(--tx-3); font-size:11px; font-variant-numeric:tabular-nums; }
  .c .nav .progrow .pri { width:6px; height:6px; border-radius:50%; }
  .c .nav .progrow .pri.ess { background:var(--accent); }
  .c .nav .progrow .pri.des { background:var(--blue); }
  .c .nav .progrow .pri.opt { background:var(--tx-3); }

  /* center: header bar + canvas */
  .c .topbar {
    height:48px; display:flex; align-items:center; gap:6px; padding:0 14px;
    border-bottom:1px solid var(--bd); background:var(--bg);
  }
  .c .iconbtn {
    height:28px; min-width:28px; padding:0 8px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:transparent; border:1px solid transparent; border-radius:6px; color:var(--tx-2); cursor:pointer;
    font:inherit; font-size:12px; font-weight:500;
  }
  .c .iconbtn:hover { background:var(--bg-1); color:var(--tx); }
  .c .iconbtn[aria-pressed="true"] { background:var(--bg-2); color:var(--tx); }
  .c .iconbtn.primary { background:var(--accent); color:#fff; border-color:var(--accent); padding:0 11px; }
  .c .iconbtn.primary:hover { background:var(--accent-2); }
  .c .iconbtn.kbd { padding:0 7px; }
  .c .kbd { font-family:"Geist Mono",monospace; font-size:10px; color:var(--tx-3); padding:1px 5px; border:1px solid var(--bd); border-radius:3px; }
  .c .sep { width:1px; height:18px; background:var(--bd); margin:0 4px; }
  .c .crumb-row { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--tx-2); }

  .c .topbar .right { margin-left:auto; display:flex; align-items:center; gap:6px; }

  .c .canvas-wrap {
    flex:1; min-height:0; position:relative; overflow:hidden;
    background:
      linear-gradient(var(--bg-1) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg, var(--bg-1) 1px, transparent 1px) 0 0/24px 24px,
      var(--bg);
  }
  .c .floating-tools {
    position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    background:var(--bg-2); border:1px solid var(--bd-2); border-radius:10px;
    padding:5px; display:flex; gap:2px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }

  .c .floating-tools .sep-v { width:1px; background:var(--bd-2); margin:4px 4px; }

  .c .lot {
    position:absolute; left:120px; top:50px; width:300px; height:780px;
    background:var(--bg-1); border:1px solid var(--bd-2); border-radius:4px;
  }
  .c .lot::before { content:""; position:absolute; inset:36px 12px 56px 12px; border:1px dashed var(--bd-2); border-radius:2px; }
  .c .lot .tag {
    position:absolute; top:8px; left:10px;
    font-family:"Geist Mono",monospace; font-size:10px; color:var(--tx-3); letter-spacing:.04em;
  }
  .c .lot .dim {
    position:absolute; right:10px; bottom:8px;
    font-family:"Geist Mono",monospace; font-size:10px; color:var(--tx-3);
  }

  .c .room {
    position:absolute; border-radius:4px;
    display:flex; flex-direction:column; padding:8px 10px; gap:2px;
    border:1px solid; backdrop-filter: blur(2px);
  }
  .c .room .lab { font-size:11px; font-weight:600; color:#fff; }
  .c .room .a2 { font-family:"Geist Mono",monospace; font-size:10px; color:rgba(255,255,255,.7); font-variant-numeric:tabular-nums; }
  .c .room.living  { background:rgba(255,180,90,.18);  border-color:rgba(255,180,90,.55); }
  .c .room.kitchen { background:rgba(255,140,80,.20);  border-color:rgba(255,140,80,.6); }

  .c .room.wet     { background:rgba(94,170,255,.18);  border-color:rgba(94,170,255,.55); }
  .c .room.outdoor { background:rgba(160,200,120,.14); border-color:rgba(160,200,120,.5); border-style:dashed; }
  .c .room.selected { box-shadow:0 0 0 2px var(--accent), 0 0 0 6px rgba(124,112,255,.2); }

  /* right rail */
  .c .right .head {
    padding:14px 16px; border-bottom:1px solid var(--bd);
    display:flex; align-items:center; justify-content:space-between;
  }
  .c .right .head .h { font-size:13px; font-weight:600; }
  .c .right .head .actions { display:flex; gap:4px; }

  .c .stats { padding:14px 16px; border-bottom:1px solid var(--bd); display:flex; flex-direction:column; gap:14px; }
  .c .stat-card {
    background:var(--bg-1); border:1px solid var(--bd); border-radius:10px; padding:12px 14px;
  }
  .c .stat-card .lbl { font-size:11px; color:var(--tx-2); letter-spacing:.02em; display:flex; align-items:center; justify-content:space-between; }
  .c .stat-card .lbl .delta { color:var(--green); font-weight:500; }
  .c .stat-card .v { display:flex; align-items:baseline; gap:6px; margin-top:6px; }
  .c .stat-card .v .num { font-size:24px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .c .stat-card .v .of { color:var(--tx-3); font-size:13px; }
  .c .stat-card .v .pct { margin-left:auto; font-size:13px; color:var(--tx-2); font-variant-numeric:tabular-nums; }
  .c .stat-card .gauge { height:5px; background:var(--bg-3); border-radius:3px; margin-top:10px; overflow:hidden; position:relative; }
  .c .stat-card .gauge > i { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--blue)); width:62%; border-radius:3px; }

  .c .legend { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; }

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function Mock({ tplId, addClass }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current) return;
    const t = document.getElementById(tplId);
    ref.current.innerHTML = '';
    const frag = t.content.cloneNode(true);
    if (addClass) {
      const root = frag.querySelector('.app');
      if (root) root.classList.add(...addClass.split(' '));
    }
    ref.current.appendChild(frag);
  }, [tplId, addClass]);
  return <div ref={ref} style={{ width:'100%', height:'100%' }} />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <DesignCanvas title="LeJplauu — Warm Studio (dark)"
    subtitle="Direction B reworked for dark mode. Originals kept below for reference.">
    <DCSection id="picked" title="Warm Studio · dark">
      <DCArtboard id="b-dark" label="B (dark) — warm dark earth, terracotta + sage accents, Instrument Serif numerals" width={1500} height={880}>
        <Mock tplId="tpl-b" addClass="dark" />
      </DCArtboard>
    </DCSection>
    <DCSection id="ref" title="Earlier directions (for reference)">
      <DCArtboard id="b-light" label="B (light) — original warm studio" width={1500} height={880}>
        <Mock tplId="tpl-b" />
      </DCArtboard>
      <DCArtboard id="a" label="A — Refined CAD" width={1500} height={880}>
        <Mock tplId="tpl-a" />
      </DCArtboard>
      <DCArtboard id="c" label="C — Modern Dashboard" width={1500} height={880}>
        <Mock tplId="tpl-c" />
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);
</script>
